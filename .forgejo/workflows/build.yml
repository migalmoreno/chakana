on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README*"

jobs:
  docker-publish:
    runs-on: cygnus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download basemap
        run: nix run .#download-basemap

      - name: Set registry
        run: echo "REGISTRY=${FORGEJO_SERVER_URL#http://}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true
              insecure = true

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          source: "."
          files: docker-compose.yml
          push: true
          set: |
            api.tags=${{ env.REGISTRY }}/${{ github.repository }}-api:latest
            web.tags=${{ env.REGISTRY }}/${{ github.repository }}-web:latest
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
